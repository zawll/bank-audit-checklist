<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Cybersecurity Audit Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--surface:#fff;--ink:#12303a;--muted:#546a72;--line:#cdd9dc;--accent:#0d5c63;--high:#b3261e;--med:#a86400;--ok:#2e7d4f;--tip:#12303a;--tipfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1f;--surface:#15272d;--ink:#e3eef0;--muted:#94acb3;--line:#27404a;--accent:#5cc1c9;--high:#ff8a80;--med:#f0b24d;--ok:#6fcf97;--tip:#e3eef0;--tipfg:#0e1b1f}}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px;max-width:66ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button[aria-pressed=true],button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,summary:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{margin-inline-start:auto;font-weight:600}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
h2{font-size:1.05rem;margin:26px 0 10px;font-weight:600;color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--med);border-radius:4px;margin-bottom:10px;padding:14px 16px}
.item.High{border-inline-start-color:var(--high)}
.item.done{opacity:.6;border-inline-start-color:var(--ok)}
.head{display:flex;gap:12px;align-items:flex-start}
.head input{margin-top:6px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.head h3{margin:0;font-size:1.02rem;font-weight:600}
.kid{color:var(--muted);margin:2px 0 8px;font-size:.93rem}
.q{margin:6px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.tag{padding:2px 8px;border:1px solid var(--line);border-radius:4px}
.tag.High{color:var(--high);border-color:var(--high)}.tag.Medium{color:var(--med);border-color:var(--med)}
a.chip{position:relative;padding:2px 8px;border:1px dashed var(--accent);border-radius:4px;color:var(--accent);text-decoration:none}
a.chip:hover{background:var(--accent);color:var(--bg)}
a.chip::after{content:attr(data-tip);position:absolute;inset-inline-start:0;top:calc(100% + 6px);width:min(300px,78vw);background:var(--tip);color:var(--tipfg);padding:9px 11px;border-radius:5px;font-size:.82rem;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;text-align:start}
a.chip:hover::after,a.chip:focus::after{opacity:1}
details{margin-top:10px}summary{cursor:pointer;color:var(--accent);font-weight:600}
details ul{margin:8px 0;padding-inline-start:20px}
.why{color:var(--muted);font-size:.93rem;margin:6px 0 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}
th,td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;font-size:.93rem}
.scroll{overflow-x:auto}
.empty{padding:18px;background:var(--surface);border:1px dashed var(--line);border-radius:4px;color:var(--muted)}
.note{margin-top:28px;color:var(--muted);font-size:.85rem;max-width:70ch}
.note a{color:var(--accent)}
@media print{.bar,.meter,.sub,#note{display:none}body{background:#fff;color:#000}.item,table{border-color:#999}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="bar" role="toolbar">
  <button id="tabC" class="on"></button>
  <button id="tabP"></button>
  <button id="hide" aria-pressed="false"></button>
  <select id="dom" aria-label="Domain"></select>
  <button id="print"></button>
  <button id="lang">العربية</button>
  <span class="prog" id="prog" aria-live="polite"></span>
</div>
<div class="meter"><i id="meter"></i></div>
<div id="view"></div>
<p class="note" id="note"></p>
</main>
<script>
const DATA={"domains": [["Access Control and Identity", "Data Protection and Encryption", "Vendor and Supply Chain Risk", "Network and Infrastructure Security", "Asset and Vulnerability Management", "Incident Response and Business Continuity"], ["التحكم في الوصول والهوية", "حماية البيانات والتشفير", "مخاطر الموردين وسلسلة الإمداد", "أمن الشبكات والبنية التحتية", "إدارة الأصول والثغرات", "الاستجابة للحوادث واستمرارية الأعمال"]], "items": [{"n": 1, "d": 0, "t": ["MFA for card-data systems", "المصادقة متعددة العوامل لأنظمة بيانات البطاقات"], "k": ["A password alone is a key anyone can copy. MFA adds a second lock.", "كلمة المرور وحدها مفتاح يسهل نسخه. المصادقة متعددة العوامل تضيف قفلًا ثانيًا."], "q": ["Does every person need a second proof of identity to access the cardholder data environment, regardless of location?", "هل يحتاج كل شخص إلى إثبات هوية ثانٍ للوصول إلى بيئة بيانات حاملي البطاقات، أينما كان موقعه؟"], "a": [["List every way into the card-data environment.", "Confirm MFA on each.", "Ask for evidence.", "Check MFA cannot be bypassed."], ["حصر كل مسارات الدخول إلى بيئة بيانات البطاقات.", "تأكيد تفعيل المصادقة متعددة العوامل على كل مسار.", "طلب أدلة على ذلك.", "التحقق من عدم إمكانية تجاوز المصادقة متعددة العوامل."]], "j": ["Req. 8.4.2 requires MFA for all access into the cardholder data environment, regardless of location. Stolen passwords are one of the most common ways attackers get in.", "يشترط البند 8.4.2 المصادقة متعددة العوامل لكل دخول إلى بيئة بيانات حاملي البطاقات أيًا كان موقع المستخدم. وتُعد كلمات المرور المسروقة من أكثر الطرق شيوعًا لاختراق الأنظمة."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 8.4.2", "e": "MFA for all access into the cardholder data environment", "a": "المصادقة متعددة العوامل لكل دخول إلى بيئة بيانات البطاقات", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-1", "e": "Identity and Access Management", "a": "إدارة الهوية والوصول", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 2, "d": 0, "t": ["Unique user IDs", "معرّفات مستخدمين فريدة"], "k": ["If everyone shares one login, nobody can tell who did what.", "إذا كان الجميع يستخدمون حساب دخول واحدًا، فلا يمكن معرفة من فعل ماذا."], "q": ["Does every employee have a personal login, with no shared or generic accounts?", "هل لكل موظف حساب دخول شخصي، دون حسابات مشتركة أو عامة؟"], "a": [["Export the user list.", "Look for generic names such as admin or teller1.", "Check how shared service accounts are controlled."], ["تصدير قائمة المستخدمين.", "البحث عن أسماء عامة مثل admin أو teller1.", "مراجعة كيفية التحكم في حسابات الخدمة المشتركة."]], "j": ["Each user gets a unique ID so any action can be traced to one person. Without it you cannot investigate fraud or prove who made a change.", "يحصل كل مستخدم على معرّف فريد بحيث يمكن نسبة أي إجراء إلى شخص واحد. وبدونه لا يمكن التحقيق في الاحتيال أو إثبات من أجرى تغييرًا."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 8.2.1", "e": "Unique ID for every user", "a": "معرّف فريد لكل مستخدم", "u": "https://www.pcisecuritystandards.org/document_library/"}]}, {"n": 3, "d": 0, "t": ["Regular access reviews", "مراجعة الصلاحيات بانتظام"], "k": ["When someone changes jobs, the old keys must be taken back.", "عندما ينتقل شخص إلى وظيفة أخرى، يجب استرداد مفاتيحه القديمة."], "q": ["How often do managers review who has access to what, and what happens when someone has too much?", "كم مرة يراجع المديرون من يملك صلاحية الوصول إلى ماذا، وماذا يحدث عند وجود صلاحيات زائدة؟"], "a": [["Ask for the last review report.", "Check vendor accounts were included.", "Confirm excess access was removed and a manager signed off."], ["طلب تقرير آخر مراجعة.", "التأكد من تضمين حسابات الموردين.", "التأكد من إزالة الصلاحيات الزائدة وتوقيع المدير على ذلك."]], "j": ["Reviews are required at least every six months, including third-party accounts, with inappropriate access fixed and management acknowledgement. People collect access over time, and unused access is a risk.", "المراجعة مطلوبة مرة كل ستة أشهر على الأقل، وتشمل حسابات الأطراف الخارجية، مع تصحيح الصلاحيات غير المناسبة وإقرار الإدارة. يجمع الناس صلاحيات بمرور الوقت، والصلاحيات غير المستخدمة تمثل خطرًا."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 7.2.4", "e": "User account and access review every six months", "a": "مراجعة الحسابات والصلاحيات كل ستة أشهر", "u": "https://www.pcisecuritystandards.org/document_library/"}]}, {"n": 4, "d": 0, "t": ["Strong passwords and account lockout", "كلمات مرور قوية وقفل الحساب"], "k": ["A short password is a weak lock, and unlimited guesses let a thief try every key.", "كلمة المرور القصيرة قفل ضعيف، والمحاولات غير المحدودة تتيح للص تجربة كل المفاتيح."], "q": ["Do all systems that hold card data require long, complex passwords and lock the account after repeated failed log-in attempts?", "هل تشترط جميع الأنظمة التي تحتوي على بيانات البطاقات كلمات مرور طويلة ومعقدة وتقفل الحساب بعد محاولات دخول فاشلة متكررة؟"], "a": [["Request the password policy and compare it to the standard.", "Check the system settings, not just the written policy.", "Test the lockout by entering a wrong password repeatedly on a test account."], ["طلب سياسة كلمات المرور ومقارنتها بالمعيار.", "فحص إعدادات النظام وليس السياسة المكتوبة فقط.", "اختبار القفل بإدخال كلمة مرور خاطئة مرارًا على حساب تجريبي."]], "j": ["Req. 8.3.6 requires passwords to be at least 12 characters long. Where a system cannot support 12 characters, at least 8 characters are required. Req. 8.3.4 requires lockout after no more than 10 failed attempts, for at least 30 minutes or until an admin unlocks the account.", "يشترط البند 8.3.6 ألا تقل كلمة المرور عن 12 حرفًا، وإذا كان النظام لا يدعم 12 حرفًا فلا تقل عن 8 أحرف. ويشترط البند 8.3.4 قفل الحساب بعد 10 محاولات فاشلة كحد أقصى، لمدة 30 دقيقة على الأقل أو حتى يفتحه مسؤول."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 8.3.6", "e": "Minimum password length", "a": "الحد الأدنى لطول كلمة المرور", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 8.3.4", "e": "Account lockout after failed attempts", "a": "قفل الحساب بعد محاولات فاشلة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-1", "e": "Identity and Access Management", "a": "إدارة الهوية والوصول", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 5, "d": 0, "t": ["Least privilege (need-to-know access)", "أقل الصلاحيات (الوصول بقدر الحاجة)"], "k": ["A teller needs the till, not the vault keys. Give each person only what their job needs.", "الصراف يحتاج إلى الدُّرج لا إلى مفاتيح الخزنة. أعطِ كل شخص ما تتطلبه وظيفته فقط."], "q": ["Is access assigned by job role, with only the minimum permissions needed, and who approves it?", "هل تُمنح الصلاحيات بحسب الدور الوظيفي وبالحد الأدنى اللازم فقط، ومن يوافق عليها؟"], "a": [["Request the role-to-access matrix.", "Sample five users and compare their access to their job.", "Check that admin rights are limited to a few named people.", "Check there is an approval record for each access request."], ["طلب مصفوفة الدور والصلاحيات.", "أخذ عينة من خمسة مستخدمين ومقارنة صلاحياتهم بوظائفهم.", "التأكد من حصر صلاحيات المسؤول في عدد قليل من الأشخاص المحددين بالاسم.", "التأكد من وجود سجل موافقة لكل طلب صلاحية."]], "j": ["Req. 7.2.2 requires access based on job function with the least privileges necessary. Extra access turns one stolen account or one careless employee into a large breach. This is also the baseline that Item 3's reviews check against.", "يشترط البند 7.2.2 منح الوصول بحسب الوظيفة وبأقل الصلاحيات اللازمة. فالصلاحيات الزائدة تحوّل حسابًا مسروقًا واحدًا أو موظفًا مهملًا إلى اختراق كبير. وهذا أيضًا الأساس الذي تقارن به مراجعات البند 3."], "r": "High", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 7.2.2", "e": "Access by job function, least privilege", "a": "الوصول بحسب الوظيفة وأقل الصلاحيات", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-1", "e": "Identity and Access Management", "a": "إدارة الهوية والوصول", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}, {"k": "cbe", "l": "CBE CD-1", "e": "Security Operations, Threat Intelligence, and Insider Threat", "a": "العمليات الأمنية واستخبارات التهديدات والتهديد الداخلي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 6, "d": 0, "t": ["Physical access to card-data areas", "الوصول المادي إلى مناطق بيانات البطاقات"], "k": ["Strong locks online mean little if anyone can walk into the server room.", "الأقفال القوية على الإنترنت لا قيمة لها إذا كان بإمكان أي شخص دخول غرفة الخوادم."], "q": ["Is physical entry to server rooms, data centers and card-processing areas restricted, approved, logged and removed when no longer needed?", "هل الدخول المادي إلى غرف الخوادم ومراكز البيانات ومناطق معالجة البطاقات مقيّد ومعتمد ومسجّل ويُلغى عند انتفاء الحاجة؟"], "a": [["Walk through the data center or server room.", "Request the list of people with physical access.", "Check the badge or visitor logs.", "Confirm that leavers' badges are disabled.", "Check that visitors are escorted."], ["القيام بجولة في مركز البيانات أو غرفة الخوادم.", "طلب قائمة الأشخاص الذين لديهم وصول مادي.", "فحص سجلات البطاقات الإلكترونية أو سجلات الزوار.", "التأكد من تعطيل بطاقات من غادروا العمل.", "التأكد من مرافقة الزوار."]], "j": ["Req. 9.2.1 requires facility entry controls for systems in the card-data environment. Req. 9.3.1 requires authorizing and managing physical access. Someone with physical access can steal or tamper with hardware and bypass many software controls.", "يشترط البند 9.2.1 ضوابط دخول للمنشأة للأنظمة الموجودة في بيئة بيانات البطاقات، ويشترط البند 9.3.1 تفويض الوصول المادي وإدارته. ومن يملك وصولًا ماديًا يمكنه سرقة الأجهزة أو العبث بها وتجاوز كثير من ضوابط البرمجيات."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 9.2.1", "e": "Facility entry controls", "a": "ضوابط الدخول إلى المنشأة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 9.3.1", "e": "Physical access authorization and management", "a": "تفويض الوصول المادي وإدارته", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-10", "e": "Physical and Environmental Security", "a": "الأمن المادي والبيئي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 7, "d": 1, "t": ["Never store the card's secret codes", "عدم تخزين الرموز السرية للبطاقة"], "k": ["After a payment is approved, throw away the secret code on the back of the card.", "بعد الموافقة على الدفع، تخلّص من الرمز السري الموجود على ظهر البطاقة."], "q": ["After a payment is authorized, does any system keep the CVV, PIN block or full magnetic-stripe data?", "بعد الموافقة على عملية الدفع، هل يحتفظ أي نظام برمز CVV أو كتلة PIN أو بيانات الشريط المغناطيسي الكاملة؟"], "a": [["Search databases, logs, backups and exports.", "Review retention periods.", "Ask what happens when such data is found."], ["البحث في قواعد البيانات والسجلات والنسخ الاحتياطية وملفات التصدير.", "مراجعة فترات الاحتفاظ.", "السؤال عمّا يحدث عند العثور على هذه البيانات."]], "j": ["Sensitive authentication data must not be kept after authorization, even if encrypted. If criminals steal it, they can make fake cards.", "يجب ألا تُحفظ بيانات المصادقة الحساسة بعد الموافقة على العملية، حتى لو كانت مشفّرة. وإذا سرقها المجرمون فيمكنهم صنع بطاقات مزوّرة."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 3.3.1", "e": "Sensitive authentication data not kept after authorization", "a": "عدم الاحتفاظ ببيانات المصادقة الحساسة بعد الموافقة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-2", "e": "Data Protection and Privacy", "a": "حماية البيانات والخصوصية", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 8, "d": 1, "t": ["Make stored card numbers unreadable", "جعل أرقام البطاقات المخزنة غير مقروءة"], "k": ["If a thief steals the filing cabinet, the papers should look like gibberish.", "إذا سرق لص خزانة الملفات، فيجب أن تبدو الأوراق كرموز لا معنى لها."], "q": ["Wherever full card numbers (PAN) are stored, how are they made unreadable?", "أينما تُخزَّن أرقام البطاقات الكاملة (PAN)، كيف تُجعل غير مقروءة؟"], "a": [["Ask for a map of where PANs are stored.", "Identify the method.", "Check how encryption keys are protected.", "Sample a database table and a backup."], ["طلب خريطة بأماكن تخزين أرقام PAN.", "تحديد الطريقة المستخدمة.", "التحقق من كيفية حماية مفاتيح التشفير.", "أخذ عينة من جدول في قاعدة البيانات ومن نسخة احتياطية."]], "j": ["PAN must be unreadable anywhere it is stored, using methods such as strong hashing, truncation, index tokens, or strong cryptography with key management. A stolen database should be useless to the thief.", "يجب أن يكون رقم PAN غير مقروء أينما خُزّن، باستخدام طرق مثل التجزئة القوية أو الاقتطاع أو الرموز المفهرسة أو التشفير القوي مع إدارة المفاتيح. وقاعدة البيانات المسروقة يجب أن تكون عديمة الفائدة للص."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 3.5.1", "e": "PAN rendered unreadable wherever stored", "a": "جعل PAN غير مقروء أينما خُزّن", "u": "https://www.pcisecuritystandards.org/document_library/"}]}, {"n": 9, "d": 1, "t": ["Encrypt card data in transit", "تشفير بيانات البطاقات أثناء نقلها"], "k": ["Unprotected card data on the internet is a postcard. Encryption is a locked box.", "بيانات البطاقات غير المحمية على الإنترنت كبطاقة بريدية مكشوفة، والتشفير صندوق مقفل."], "q": ["Is card data encrypted whenever it travels over the internet or other public networks?", "هل تُشفَّر بيانات البطاقات كلما انتقلت عبر الإنترنت أو الشبكات العامة؟"], "a": [["List external connections (websites, partners, mobile apps).", "Check protocol and certificate on each.", "Scan for weak settings.", "Confirm card data is never sent by plain email."], ["حصر الاتصالات الخارجية (المواقع والشركاء وتطبيقات الهاتف).", "فحص البروتوكول والشهادة في كل اتصال.", "فحص الإعدادات الضعيفة.", "التأكد من عدم إرسال بيانات البطاقات عبر البريد الإلكتروني العادي."]], "j": ["Strong cryptography must protect PAN over open, public networks. Without it, anyone on the path can read or alter the data.", "يجب أن يحمي التشفير القوي رقم PAN عبر الشبكات العامة المفتوحة. وبدونه يستطيع أي شخص على المسار قراءة البيانات أو تعديلها."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 4.2.1", "e": "Strong cryptography for PAN over open networks", "a": "تشفير قوي لـ PAN عبر الشبكات المفتوحة", "u": "https://www.pcisecuritystandards.org/document_library/"}]}, {"n": 10, "d": 1, "t": ["Keep card data only as long as needed", "الاحتفاظ ببيانات البطاقات بقدر الحاجة فقط"], "k": ["Data you no longer hold cannot be stolen. Delete what you do not need.", "البيانات التي لا تحتفظ بها لا يمكن سرقتها. احذف ما لا تحتاجه."], "q": ["Is there a written retention policy that defines how long card data is kept, and is data deleted securely when the period ends?", "هل توجد سياسة مكتوبة للاحتفاظ تحدد مدة حفظ بيانات البطاقات، وهل تُحذف البيانات بأمان عند انتهاء المدة؟"], "a": [["Request the retention and disposal policy.", "Check that a quarterly process finds and deletes expired data.", "Sample old records, backups and archives for expired card data.", "Ask what business reason justifies each retention period."], ["طلب سياسة الاحتفاظ والإتلاف.", "التأكد من وجود عملية ربع سنوية تكتشف البيانات المنتهية وتحذفها.", "فحص عينة من السجلات القديمة والنسخ الاحتياطية والأرشيف بحثًا عن بيانات بطاقات منتهية.", "السؤال عن المبرر التجاري لكل مدة احتفاظ."]], "j": ["Req. 3.2.1 requires account data storage to be kept to a minimum through retention and disposal policies. Old forgotten copies are a common source of breaches. Less data stored also means a smaller area to audit.", "يشترط البند 3.2.1 إبقاء تخزين بيانات الحساب عند الحد الأدنى عبر سياسات الاحتفاظ والإتلاف. والنسخ القديمة المنسية مصدر شائع للاختراقات. كما أن تقليل البيانات المخزنة يقلل نطاق التدقيق."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 3.2.1", "e": "Minimize account data storage and retention", "a": "تقليل تخزين بيانات الحساب والاحتفاظ بها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-2", "e": "Data Protection and Privacy", "a": "حماية البيانات والخصوصية", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 11, "d": 1, "t": ["Encryption key management", "إدارة مفاتيح التشفير"], "k": ["An unbreakable lock is useless if the key is taped to the door.", "القفل الذي لا يُكسر عديم الفائدة إذا كان المفتاح معلقًا على الباب."], "q": ["How are encryption keys protected, who can access them, and how often are they replaced?", "كيف تُحمى مفاتيح التشفير، ومن يمكنه الوصول إليها، وكم مرة تُستبدل؟"], "a": [["Request the key management procedure.", "Check that keys are stored apart from the data they protect, for example in an HSM or key vault.", "Check that only a few named custodians have access.", "Confirm that keys are rotated when their cryptoperiod ends.", "Check there is a process for a suspected key compromise."], ["طلب إجراء إدارة المفاتيح.", "التأكد من حفظ المفاتيح بعيدًا عن البيانات التي تحميها، مثلًا في HSM أو خزنة مفاتيح.", "التأكد من أن عددًا قليلًا من الأمناء المحددين بالاسم فقط يملكون الوصول.", "التأكد من تدوير المفاتيح عند انتهاء مدة استخدامها التشفيري.", "التأكد من وجود إجراء للتعامل مع الاشتباه في اختراق مفتاح."]], "j": ["Req. 3.6.1 requires procedures that protect keys from disclosure and misuse. Req. 3.7.4 requires keys to be changed at the end of their cryptoperiod. Anyone who gets the key can decrypt all the data, so Items 8 and 9 depend on this control.", "يشترط البند 3.6.1 إجراءات تحمي المفاتيح من الكشف وسوء الاستخدام، ويشترط البند 3.7.4 تغيير المفاتيح عند نهاية مدة استخدامها التشفيري. ومن يحصل على المفتاح يستطيع فك تشفير كل البيانات، ولذلك يعتمد البندان 8 و9 على هذا الضابط."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 3.6.1", "e": "Protect cryptographic keys", "a": "حماية مفاتيح التشفير", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 3.7.4", "e": "Key changes at end of cryptoperiod", "a": "تغيير المفاتيح عند نهاية مدة استخدامها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-3", "e": "Cryptography", "a": "التشفير", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 12, "d": 2, "t": ["Know your vendors and sign contracts", "معرفة الموردين وتوقيع العقود"], "k": ["You must know who holds your treasure, and they must promise to guard it.", "يجب أن تعرف من يحتفظ بكنزك، وأن يتعهدوا بحراسته."], "q": ["Do you keep a list of every vendor that touches card data or could affect its security, and does each have a written agreement accepting responsibility?", "هل لديكم قائمة بكل مورد يتعامل مع بيانات البطاقات أو قد يؤثر على أمنها، وهل لكل منهم اتفاق مكتوب يقرّ بمسؤوليته؟"], "a": [["Request the vendor list.", "Check each entry has a service description.", "Read a sample contract for the responsibility clause.", "Find vendors that are missing."], ["طلب قائمة الموردين.", "التأكد من أن لكل مورد وصفًا للخدمة.", "قراءة عقد نموذجي للتحقق من بند المسؤولية.", "البحث عن الموردين غير المدرجين في القائمة."]], "j": ["You cannot protect what you do not know about, and contracts make vendor responsibility enforceable.", "لا يمكنك حماية ما لا تعرفه، والعقود تجعل مسؤولية المورد قابلة للإلزام."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 12.8.1", "e": "List of third-party service providers", "a": "قائمة مزودي الخدمة من الأطراف الخارجية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.8.2", "e": "Written agreements with service providers", "a": "اتفاقات مكتوبة مع مزودي الخدمة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE OVM-1", "e": "Outsourcing and Vendor Management", "a": "الاستعانة بمصادر خارجية وإدارة الموردين", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 13, "d": 2, "t": ["Check your vendors every year", "فحص الموردين كل عام"], "k": ["A vendor that was safe last year may not be safe now.", "المورد الذي كان آمنًا العام الماضي قد لا يكون آمنًا الآن."], "q": ["Do you check each vendor's PCI DSS compliance at least yearly, and do you know which security duties are yours and which are theirs?", "هل تتحققون من امتثال كل مورد لمعيار PCI DSS مرة سنويًا على الأقل، وهل تعرفون أي واجبات أمنية عليكم وأيها عليهم؟"], "a": [["Ask for the last annual review per vendor.", "Check certificates or other evidence.", "Ask for the document showing who handles which requirement.", "Follow up on vendors that failed or did not respond."], ["طلب آخر مراجعة سنوية لكل مورد.", "فحص الشهادات أو الأدلة الأخرى.", "طلب الوثيقة التي توضح من يتولى أي متطلب.", "متابعة الموردين الذين أخفقوا أو لم يردّوا."]], "j": ["Compliance must be monitored at least every 12 months, with a record of which requirements are managed by the provider, by you, or shared. Many bank breaches start at a vendor, and unclear ownership leaves gaps.", "يجب رصد الامتثال مرة كل 12 شهرًا على الأقل، مع سجل يبيّن المتطلبات التي يديرها المورد أو أنتم أو تُدار بالاشتراك. وكثير من اختراقات البنوك تبدأ من مورد، وغموض المسؤولية يترك ثغرات."], "r": "High", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 12.8.4", "e": "Monitor service provider compliance yearly", "a": "رصد امتثال مزودي الخدمة سنويًا", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.8.5", "e": "Which requirements are managed by whom", "a": "من يدير أي متطلب", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE OVM-1", "e": "Outsourcing and Vendor Management", "a": "الاستعانة بمصادر خارجية وإدارة الموردين", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 14, "d": 2, "t": ["Control third-party remote access", "التحكم في وصول الأطراف الخارجية عن بُعد"], "k": ["Give a repair person a visitor pass for the visit, not a permanent key.", "أعطِ عامل الصيانة تصريح زائر للزيارة، لا مفتاحًا دائمًا."], "q": ["Are vendor remote-access accounts turned on only when needed, turned off afterward, and monitored while in use?", "هل تُفعَّل حسابات الوصول عن بُعد للموردين عند الحاجة فقط وتُعطَّل بعدها وتُراقب أثناء استخدامها؟"], "a": [["List all vendor accounts and remote-access tools.", "Check how and when each account is enabled and disabled.", "Review the logs of recent vendor sessions.", "Confirm that vendors use MFA (Item 1).", "Find any always-on vendor accounts."], ["حصر كل حسابات الموردين وأدوات الوصول عن بُعد.", "فحص كيف ومتى يُفعَّل كل حساب ويُعطَّل.", "مراجعة سجلات جلسات الموردين الأخيرة.", "التأكد من استخدام الموردين للمصادقة متعددة العوامل (البند 1).", "البحث عن أي حسابات موردين تعمل دائمًا."]], "j": ["Req. 8.2.7 requires third-party accounts to be enabled only for the time needed, disabled when not in use, and monitored for unexpected activity. Attackers often reach a bank through a vendor's remote connection. This is the control for the vendor risk that Items 12 and 13 describe.", "يشترط البند 8.2.7 تفعيل حسابات الأطراف الخارجية للمدة اللازمة فقط، وتعطيلها عند عدم الاستخدام، ومراقبتها لرصد أي نشاط غير متوقع. وكثيرًا ما يصل المهاجمون إلى البنك عبر اتصال مورد عن بُعد. وهذا هو الضابط لمخاطر الموردين التي يصفها البندان 12 و13."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 8.2.7", "e": "Third-party accounts enabled only when needed", "a": "حسابات الأطراف الخارجية تُفعَّل عند الحاجة فقط", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 8.4.3", "e": "MFA for remote network access", "a": "المصادقة متعددة العوامل للوصول عن بُعد", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE OVM-1", "e": "Outsourcing and Vendor Management", "a": "الاستعانة بمصادر خارجية وإدارة الموردين", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 15, "d": 3, "t": ["Firewall rules are defined and reviewed", "تحديد قواعد جدار الحماية ومراجعتها"], "k": ["A fence only works if the gates are checked regularly and nobody leaves one open.", "السور لا ينفع إلا إذا فُحصت بواباته بانتظام ولم يترك أحد بابًا مفتوحًا."], "q": ["Are firewall and router rules written down, approved, and reviewed at least every six months to remove rules that are no longer needed?", "هل قواعد جدران الحماية والموجّهات مكتوبة ومعتمدة وتُراجع مرة كل ستة أشهر على الأقل لإزالة القواعد غير اللازمة؟"], "a": [["Request the firewall configuration standard.", "Ask for the last rule review record and who approved it.", "Sample five rules and ask for the business reason for each.", "Look for \"any to any\" rules and unused rules."], ["طلب معيار إعداد جدار الحماية.", "طلب سجل آخر مراجعة للقواعد ومن اعتمدها.", "أخذ عينة من خمس قواعد وطلب المبرر التجاري لكل منها.", "البحث عن قواعد \"any to any\" والقواعد غير المستخدمة."]], "j": ["Network security controls must have defined configuration standards and their rule sets must be reviewed at least every six months. Old and overly broad rules are a common way attackers move around a bank network.", "يجب أن تكون لضوابط أمن الشبكة معايير إعداد محددة، وأن تُراجع مجموعات قواعدها مرة كل ستة أشهر على الأقل. والقواعد القديمة والواسعة جدًا طريق شائع يتنقل به المهاجمون داخل شبكة البنك."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 1.2.1", "e": "Network security control configuration standards", "a": "معايير إعداد ضوابط أمن الشبكة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 1.2.7", "e": "Review of network security control configurations every six months", "a": "مراجعة إعدادات ضوابط أمن الشبكة كل ستة أشهر", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 16, "d": 3, "t": ["Traffic to the card-data network is restricted", "تقييد حركة البيانات إلى شبكة بيانات البطاقات"], "k": ["Only people with a reason to enter the vault room get through the door, and only approved things may leave.", "من لديه سبب فقط يدخل غرفة الخزنة، ولا يخرج منها إلا ما هو معتمد."], "q": ["Is traffic into and out of the card-data environment limited to what is strictly necessary, with everything else denied?", "هل حركة البيانات الداخلة إلى بيئة بيانات البطاقات والخارجة منها محدودة بما هو ضروري تمامًا، مع رفض كل ما عداه؟"], "a": [["Ask for the inbound and outbound rule sets for the card-data network.", "Confirm the default is deny.", "Test that an unapproved connection is blocked.", "Ask how new rules are requested and approved."], ["طلب مجموعات القواعد الواردة والصادرة لشبكة بيانات البطاقات.", "التأكد من أن الوضع الافتراضي هو الرفض.", "اختبار أن اتصالًا غير معتمد يُحظر.", "السؤال عن كيفية طلب القواعد الجديدة واعتمادها."]], "j": ["Inbound and outbound traffic to the cardholder data environment must be restricted to what is necessary, and all other traffic specifically denied. This limits both attacker entry and data leaving the bank.", "يجب تقييد الحركة الواردة والصادرة إلى بيئة بيانات حاملي البطاقات بما هو ضروري، ورفض كل ما عداه بشكل صريح. وهذا يحد من دخول المهاجمين ومن تسرب البيانات خارج البنك."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 1.3.1", "e": "Inbound traffic to the CDE restricted", "a": "تقييد الحركة الواردة إلى بيئة بيانات البطاقات", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 1.3.2", "e": "Outbound traffic from the CDE restricted", "a": "تقييد الحركة الصادرة من بيئة بيانات البطاقات", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 17, "d": 3, "t": ["Network segmentation is proven to work", "إثبات فاعلية تجزئة الشبكة"], "k": ["Walls between rooms only help if you check that the doors really lock.", "الجدران بين الغرف لا تفيد إلا إذا تحققت من أن الأبواب مقفلة فعلًا."], "q": ["If the bank uses segmentation to keep card systems separate, is it tested at least every 12 months to prove it isolates them?", "إذا كان البنك يستخدم التجزئة لعزل أنظمة البطاقات، فهل تُختبر مرة كل 12 شهرًا على الأقل لإثبات أنها تعزلها؟"], "a": [["Ask for the latest segmentation test report.", "Check who performed it and that it covered all segmentation points.", "Confirm failed findings were fixed and retested."], ["طلب أحدث تقرير لاختبار التجزئة.", "التأكد من هوية من أجراه ومن أنه شمل كل نقاط التجزئة.", "التأكد من إصلاح النتائج الفاشلة وإعادة اختبارها."]], "j": ["Segmentation shrinks the number of systems that must meet PCI DSS, but only if it really works. 11.4.5 requires testing at least every 12 months and after changes. 11.4.6 requires service providers to test at least every six months and after changes.", "تقلل التجزئة عدد الأنظمة الخاضعة لمعيار PCI DSS، لكن فقط إذا كانت فعّالة حقًا. يشترط البند 11.4.5 الاختبار مرة كل 12 شهرًا على الأقل وبعد التغييرات. ويشترط البند 11.4.6 أن يختبر مزودو الخدمة كل ستة أشهر على الأقل وبعد التغييرات."], "r": "High", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 11.4.5", "e": "Segmentation testing", "a": "اختبار التجزئة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 11.4.6", "e": "Segmentation testing for service providers", "a": "اختبار التجزئة لمزودي الخدمة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 18, "d": 3, "t": ["Network and data-flow diagrams are accurate", "دقة مخططات الشبكة وتدفق البيانات"], "k": ["You cannot guard a building if you do not have a map of it.", "لا يمكنك حراسة مبنى لا تملك خريطة له."], "q": ["Does the bank keep a current network diagram and a diagram showing how card data flows between systems?", "هل يحتفظ البنك بمخطط شبكة حديث ومخطط يوضح كيف تتدفق بيانات البطاقات بين الأنظمة؟"], "a": [["Request both diagrams and the date they were last reviewed.", "Walk one card transaction through the diagram.", "Compare the diagram with a real network scan.", "Check it is updated after changes."], ["طلب المخططين وتاريخ آخر مراجعة لهما.", "تتبع عملية بطاقة واحدة على المخطط.", "مقارنة المخطط بفحص فعلي للشبكة.", "التأكد من تحديثه بعد التغييرات."]], "j": ["The diagrams define what is in scope. If a system that handles card data is missing from the map, it will also be missing from every control.", "تحدد المخططات ما يدخل في النطاق. وإذا كان نظام يتعامل مع بيانات البطاقات غائبًا عن الخريطة، فسيغيب أيضًا عن كل الضوابط."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 1.2.3", "e": "Accurate network diagram", "a": "مخطط شبكة دقيق", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 1.2.4", "e": "Accurate data-flow diagram", "a": "مخطط تدفق بيانات دقيق", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 19, "d": 3, "t": ["Wireless networks are controlled", "ضبط الشبكات اللاسلكية"], "k": ["A hidden back door is dangerous if you do not know it exists.", "الباب الخلفي المخفي خطر إذا كنت لا تعلم بوجوده."], "q": ["Does the bank check at least quarterly for unauthorized wireless access points, and is any wireless network that carries card data strongly encrypted?", "هل يفحص البنك مرة كل ربع سنة على الأقل وجود نقاط وصول لاسلكية غير مصرّح بها، وهل أي شبكة لاسلكية تنقل بيانات البطاقات مشفّرة تشفيرًا قويًا؟"], "a": [["Ask for the authorized access point list.", "Request the last quarterly wireless scan or the network access control evidence.", "Check how a rogue device is removed.", "Confirm wireless encryption settings."], ["طلب قائمة نقاط الوصول المصرّح بها.", "طلب آخر فحص لاسلكي ربع سنوي أو أدلة التحكم في الدخول إلى الشبكة.", "التحقق من كيفية إزالة الجهاز المارق.", "التأكد من إعدادات التشفير اللاسلكي."]], "j": ["The standard requires detection and identification of authorized and unauthorized wireless access points every quarter, and strong cryptography for wireless networks sending card data. A rogue access point inside a branch is an easy way into the network.", "يشترط المعيار اكتشاف نقاط الوصول اللاسلكية المصرّح بها وغير المصرّح بها وتحديدها كل ربع سنة، واستخدام تشفير قوي للشبكات اللاسلكية التي تنقل بيانات البطاقات. ونقطة وصول مارقة داخل فرع تمثل طريقًا سهلًا إلى الشبكة."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 11.2.1", "e": "Wireless access point detection", "a": "اكتشاف نقاط الوصول اللاسلكية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 4.2.1.2", "e": "Strong cryptography on wireless networks", "a": "تشفير قوي للشبكات اللاسلكية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 20, "d": 3, "t": ["Intrusion detection and prevention", "كشف التسلل ومنعه"], "k": ["A burglar alarm tells you when someone is trying a window.", "جهاز الإنذار يخبرك عندما يحاول أحدهم فتح نافذة."], "q": ["Are intrusion detection or prevention tools watching traffic at the edge of the card-data network and at critical points inside it?", "هل أدوات كشف التسلل أو منعه تراقب حركة البيانات عند حافة شبكة بيانات البطاقات وعند النقاط الحرجة داخلها؟"], "a": [["Ask where sensors are placed.", "Check signatures and rules are kept up to date.", "Request an example alert and how it was handled.", "Confirm someone is alerted when it fires."], ["السؤال عن أماكن وضع المستشعرات.", "التأكد من تحديث التواقيع والقواعد.", "طلب مثال على تنبيه وكيف جرى التعامل معه.", "التأكد من تنبيه شخص ما عند تشغيله."]], "j": ["Intrusion detection and prevention techniques are required to detect or stop intrusions into the network. Without them an attacker can work inside a bank for months unnoticed.", "تُشترط تقنيات كشف التسلل ومنعه لاكتشاف الاختراقات إلى الشبكة أو إيقافها. وبدونها قد يعمل المهاجم داخل البنك أشهرًا دون أن يلاحظه أحد."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 11.5.1", "e": "Intrusion detection and prevention", "a": "كشف التسلل ومنعه", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}, {"k": "cbe", "l": "CBE CD-1", "e": "Security Operations, Threat Intelligence, and Insider Threat", "a": "العمليات الأمنية واستخبارات التهديدات والتهديد الداخلي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 21, "d": 3, "t": ["No unnecessary or insecure services", "لا خدمات غير ضرورية أو غير آمنة"], "k": ["Every unused door you leave unlocked is a risk with no benefit.", "كل باب غير مستخدم تتركه مفتوحًا خطر بلا فائدة."], "q": ["Are only necessary services, protocols and ports enabled, and is each insecure one (such as Telnet or FTP) justified and protected by extra controls?", "هل تُفعَّل الخدمات والبروتوكولات والمنافذ الضرورية فقط، وهل كل بروتوكول غير آمن (مثل Telnet أو FTP) له مبرر ومحمي بضوابط إضافية؟"], "a": [["Run or request a port and service scan of key servers.", "List any insecure protocols found.", "Ask for the written business reason and the compensating control for each.", "Confirm default accounts are changed or disabled."], ["إجراء أو طلب فحص للمنافذ والخدمات على الخوادم الرئيسية.", "سرد أي بروتوكولات غير آمنة وُجدت.", "طلب المبرر التجاري المكتوب والضابط البديل لكل منها.", "التأكد من تغيير الحسابات الافتراضية أو تعطيلها."]], "j": ["Only necessary services may be enabled, and any insecure ones must be justified and have added security features. Extra services create extra ways in.", "لا يجوز تفعيل إلا الخدمات الضرورية، ويجب تبرير أي خدمة غير آمنة وإضافة ميزات أمان لها. والخدمات الزائدة تعني منافذ دخول زائدة."], "r": "Medium", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 2.2.4", "e": "Only necessary services enabled", "a": "تفعيل الخدمات الضرورية فقط", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 2.2.5", "e": "Insecure services justified and secured", "a": "تبرير الخدمات غير الآمنة وتأمينها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 22, "d": 3, "t": ["Staff devices and remote connections are protected", "حماية أجهزة الموظفين والاتصالات عن بُعد"], "k": ["A laptop that visits the internet and the vault must carry its own guard.", "الحاسوب المحمول الذي يزور الإنترنت والخزنة معًا يجب أن يحمل حارسه الخاص."], "q": ["Do laptops, mobiles and other devices that connect both to the internet and to the card-data network have firewall protection and controlled settings?", "هل تتوافر لأجهزة الحاسوب المحمولة والهواتف وغيرها مما يتصل بالإنترنت وبشبكة بيانات البطاقات معًا حماية بجدار ناري وإعدادات مضبوطة؟"], "a": [["List device types that can reach both networks.", "Check a personal firewall or equivalent is active and users cannot turn it off.", "Ask how remote connections to the bank network are secured and logged."], ["حصر أنواع الأجهزة التي تصل إلى الشبكتين.", "التأكد من تفعيل جدار ناري شخصي أو ما يعادله ومن عدم قدرة المستخدمين على إيقافه.", "السؤال عن كيفية تأمين الاتصالات عن بُعد بشبكة البنك وتسجيلها."]], "j": ["Security controls are required on any computing device that connects to both untrusted networks and the card-data environment. An infected laptop can become a bridge into the bank.", "تُشترط ضوابط أمنية على أي جهاز حوسبة يتصل بالشبكات غير الموثوقة وببيئة بيانات البطاقات معًا. والحاسوب المحمول المصاب قد يصبح جسرًا إلى البنك."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 1.5.1", "e": "Controls on devices connecting to both untrusted networks and the CDE", "a": "ضوابط على الأجهزة المتصلة بالشبكات غير الموثوقة وببيئة البطاقات", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-6", "e": "Network Security", "a": "أمن الشبكات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}, {"k": "cbe", "l": "CBE CTO-7", "e": "Endpoint Security", "a": "أمن الأجهزة الطرفية", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 23, "d": 4, "t": ["Inventory of systems and software", "جرد الأنظمة والبرمجيات"], "k": ["You cannot protect what you do not know you own.", "لا يمكنك حماية ما لا تعرف أنك تملكه."], "q": ["Does the bank keep a current inventory of all hardware and software in scope, with an owner and purpose for each?", "هل يحتفظ البنك بجرد حديث لكل الأجهزة والبرمجيات الداخلة في النطاق، مع مالك وغرض لكل منها؟"], "a": [["Request the inventory and its last update date.", "Compare it with a network scan to find unlisted devices.", "Check each entry has an owner.", "Ask how new systems are added and old ones retired."], ["طلب الجرد وتاريخ آخر تحديث له.", "مقارنته بفحص للشبكة لاكتشاف الأجهزة غير المدرجة.", "التأكد من أن لكل بند مالكًا.", "السؤال عن كيفية إضافة الأنظمة الجديدة وإخراج القديمة."]], "j": ["An inventory of system components in scope must be maintained and kept current. Unknown systems are never patched, scanned or monitored, so they are where attackers often get in.", "يجب الاحتفاظ بجرد لمكونات النظام الداخلة في النطاق وإبقاؤه حديثًا. والأنظمة المجهولة لا تُرقَّع ولا تُفحص ولا تُراقب، ولذلك كثيرًا ما يدخل منها المهاجمون."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 12.5.1", "e": "Inventory of in-scope system components", "a": "جرد مكونات النظام الداخلة في النطاق", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CRM-2", "e": "Asset Management", "a": "إدارة الأصول", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 24, "d": 4, "t": ["Secure configuration standards", "معايير الإعداد الآمن"], "k": ["A new lock should be set up properly before it is put on the door.", "القفل الجديد يجب ضبطه جيدًا قبل تركيبه على الباب."], "q": ["Does the bank have hardening standards for every type of system, and are vendor default accounts and passwords removed or changed?", "هل لدى البنك معايير تقوية (hardening) لكل نوع من الأنظمة، وهل أُزيلت حسابات وكلمات مرور المورد الافتراضية أو غُيّرت؟"], "a": [["Request the hardening standards.", "Check them against a recognised benchmark.", "Sample two servers against the standard.", "Look for default passwords on network devices and databases."], ["طلب معايير التقوية.", "مقارنتها بمرجع معترف به.", "مطابقة خادمين على سبيل العينة مع المعيار.", "البحث عن كلمات مرور افتراضية على أجهزة الشبكة وقواعد البيانات."]], "j": ["Configuration standards must be developed, applied and kept up to date, and vendor default accounts must be managed. Default settings are publicly known and a common cause of breaches.", "يجب وضع معايير الإعداد وتطبيقها وتحديثها، وإدارة حسابات المورد الافتراضية. والإعدادات الافتراضية معروفة للجميع وسبب شائع للاختراقات."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 2.2.1", "e": "Configuration standards", "a": "معايير الإعداد", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 2.2.2", "e": "Vendor default accounts managed", "a": "إدارة حسابات المورد الافتراضية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-12", "e": "Change Management", "a": "إدارة التغيير", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 25, "d": 4, "t": ["Security patches applied on time", "تطبيق التصحيحات الأمنية في وقتها"], "k": ["When a lock maker says \"this lock can be picked,\" you must fix it fast.", "عندما يقول صانع القفل \"هذا القفل يمكن فتحه\"، يجب أن تصلحه بسرعة."], "q": ["Are critical security patches installed within one month of release, and are other vulnerabilities addressed within risk-based timeframes?", "هل تُثبَّت التصحيحات الأمنية الحرجة خلال شهر من إصدارها، وهل تُعالج الثغرات الأخرى ضمن أطر زمنية قائمة على المخاطر؟"], "a": [["Ask for the patch policy and timelines.", "Request a patch report for the last quarter.", "Find the oldest unpatched critical item and ask why.", "Check how emergency patches are handled."], ["طلب سياسة التصحيحات وجداولها الزمنية.", "طلب تقرير التصحيحات للربع الأخير.", "إيجاد أقدم بند حرج غير مصحَّح والسؤال عن السبب.", "فحص كيفية التعامل مع التصحيحات الطارئة."]], "j": ["Req. 6.3.3 requires critical or high-security vulnerabilities to be addressed by installing applicable patches within one month of release. Other vulnerabilities must be addressed within timeframes determined by the entity based on risk. Attackers exploit known flaws within days of publication.", "يشترط البند 6.3.3 معالجة الثغرات الحرجة أو عالية الخطورة بتثبيت التصحيحات المناسبة خلال شهر من إصدارها. وتُعالج الثغرات الأخرى ضمن أطر زمنية تحددها الجهة بحسب المخاطر. ويستغل المهاجمون الثغرات المعروفة خلال أيام من نشرها."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 6.3.3", "e": "Security patches installed on time", "a": "تثبيت التصحيحات الأمنية في وقتها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-9", "e": "Vulnerability and Patch Management", "a": "إدارة الثغرات والتصحيحات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 26, "d": 4, "t": ["Internal vulnerability scans and ranking", "الفحص الداخلي للثغرات وترتيبها"], "k": ["Regular health check-ups find problems while they are still small.", "الفحوص الصحية الدورية تكتشف المشكلات وهي لا تزال صغيرة."], "q": ["Are internal vulnerability scans run at least every quarter, with findings ranked by risk and high-risk ones fixed and rescanned?", "هل تُجرى فحوص الثغرات الداخلية مرة كل ربع سنة على الأقل، مع ترتيب النتائج بحسب المخاطر وإصلاح الثغرات عالية الخطورة وإعادة فحصها؟"], "a": [["Request the last four quarterly scan reports.", "Check the ranking method.", "Confirm high-risk findings were fixed and rescanned.", "Ask who owns remediation."], ["طلب آخر أربعة تقارير فحص ربع سنوية.", "فحص طريقة الترتيب.", "التأكد من إصلاح النتائج عالية الخطورة وإعادة فحصها.", "السؤال عن المسؤول عن المعالجة."]], "j": ["Vulnerabilities must be identified and ranked, and internal scans run at least once every three months, with high-risk findings resolved and rescanned. Scanning shows weaknesses before an attacker does.", "يجب تحديد الثغرات وترتيبها، وإجراء الفحوص الداخلية مرة كل ثلاثة أشهر على الأقل، مع حل النتائج عالية الخطورة وإعادة فحصها. والفحص يكشف نقاط الضعف قبل أن يكتشفها المهاجم."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 6.3.1", "e": "Identify and rank vulnerabilities", "a": "تحديد الثغرات وترتيبها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 11.3.1", "e": "Internal vulnerability scans", "a": "فحوص الثغرات الداخلية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-9", "e": "Vulnerability and Patch Management", "a": "إدارة الثغرات والتصحيحات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 27, "d": 4, "t": ["External scans by an approved vendor", "الفحص الخارجي بواسطة مزود معتمد"], "k": ["An outside inspector looks at your building from the street, as a burglar would.", "مفتش من الخارج ينظر إلى مبناك من الشارع كما يفعل اللص."], "q": ["Are external scans done at least quarterly by a PCI-approved scanning vendor (ASV), with passing results?", "هل تُجرى الفحوص الخارجية مرة كل ربع سنة على الأقل بواسطة مزود فحص معتمد من PCI (ASV)، بنتائج ناجحة؟"], "a": [["Request the last four ASV reports.", "Check each shows a passing status or a rescan.", "Confirm all internet-facing addresses are included."], ["طلب آخر أربعة تقارير ASV.", "التأكد من أن كل تقرير يُظهر حالة ناجحة أو إعادة فحص.", "التأكد من تضمين كل عناوين الإنترنت المكشوفة."]], "j": ["External vulnerability scans must be performed at least once every three months by an ASV. Internet-facing systems are the first thing attackers probe.", "يجب إجراء فحوص الثغرات الخارجية مرة كل ثلاثة أشهر على الأقل بواسطة ASV. والأنظمة المواجهة للإنترنت أول ما يجسّه المهاجمون."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 11.3.2", "e": "External scans by an ASV", "a": "فحوص خارجية بواسطة ASV", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-9", "e": "Vulnerability and Patch Management", "a": "إدارة الثغرات والتصحيحات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 28, "d": 4, "t": ["Penetration testing", "اختبار الاختراق"], "k": ["Hire a friendly burglar to try to break in and tell you how.", "استأجر لصًا ودودًا ليحاول الاقتحام ويخبرك كيف."], "q": ["Is a penetration test done at least every 12 months and after major changes, for both internal and external networks, with findings fixed?", "هل يُجرى اختبار اختراق مرة كل 12 شهرًا على الأقل وبعد التغييرات الكبرى، للشبكتين الداخلية والخارجية، مع إصلاح النتائج؟"], "a": [["Request the latest report and the tester's qualifications.", "Check scope covers the card-data environment.", "Confirm exploitable findings were fixed and retested."], ["طلب أحدث تقرير ومؤهلات القائم بالاختبار.", "التأكد من أن النطاق يغطي بيئة بيانات البطاقات.", "التأكد من إصلاح النتائج القابلة للاستغلال وإعادة اختبارها."]], "j": ["Penetration testing must follow a defined method and be done at least annually and after significant changes. It shows whether weaknesses can really be exploited, not just listed.", "يجب أن يتبع اختبار الاختراق منهجية محددة وأن يُجرى سنويًا على الأقل وبعد التغييرات الجوهرية. فهو يبيّن ما إذا كانت نقاط الضعف قابلة للاستغلال فعلًا، لا مجرد إدراجها."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 11.4.1", "e": "Penetration testing methodology", "a": "منهجية اختبار الاختراق", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 11.4.2", "e": "Internal penetration testing", "a": "اختبار الاختراق الداخلي", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 11.4.3", "e": "External penetration testing", "a": "اختبار الاختراق الخارجي", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE OVM-3", "e": "Cybersecurity Testing", "a": "اختبار الأمن السيبراني", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 29, "d": 4, "t": ["Anti-malware protection", "الحماية من البرمجيات الخبيثة"], "k": ["An antivirus is a guard who must learn about new thieves every day.", "برنامج مكافحة الفيروسات حارس يجب أن يتعلم كل يوم عن لصوص جدد."], "q": ["Is anti-malware software deployed on all systems at risk, and does it update automatically?", "هل تُثبَّت برمجيات مكافحة البرمجيات الخبيثة على كل الأنظمة المعرّضة للخطر، وهل تتحدث تلقائيًا؟"], "a": [["Ask for coverage numbers against the inventory.", "List systems excluded and the reason.", "Check update status on a sample.", "Confirm users cannot disable it."], ["طلب نسب التغطية مقارنة بالجرد.", "سرد الأنظمة المستثناة والسبب.", "فحص حالة التحديث على عينة.", "التأكد من أن المستخدمين لا يستطيعون تعطيلها."]], "j": ["Anti-malware must be deployed on system components at risk of malware, kept current, and be active. Ransomware and banking trojans remain common threats to banks.", "يجب نشر مكافحة البرمجيات الخبيثة على مكونات النظام المعرّضة لها، وإبقاؤها محدّثة وفعّالة. وتظل برامج الفدية وأحصنة طروادة المصرفية من التهديدات الشائعة للبنوك."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 5.2.1", "e": "Anti-malware deployed", "a": "نشر مكافحة البرمجيات الخبيثة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 5.3.1", "e": "Anti-malware kept current", "a": "إبقاء مكافحة البرمجيات الخبيثة محدّثة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-7", "e": "Endpoint Security", "a": "أمن الأجهزة الطرفية", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 30, "d": 4, "t": ["Protect public web applications", "حماية تطبيقات الويب العامة"], "k": ["The bank's website is the front door open to the whole world.", "موقع البنك هو الباب الأمامي المفتوح للعالم كله."], "q": ["Are public-facing web applications (online banking, card portals) protected by an automated solution such as a web application firewall, running continuously?", "هل تحمي تطبيقات الويب العامة (الخدمات المصرفية عبر الإنترنت وبوابات البطاقات) حلٌّ آلي مثل جدار حماية تطبيقات الويب يعمل باستمرار؟"], "a": [["Ask which web applications are public.", "Request evidence of the protection tool and its rule updates.", "Confirm that it either blocks web-based attacks or generates alerts that are immediately investigated.", "Ask how new applications are tested before release."], ["السؤال عن تطبيقات الويب العامة.", "طلب أدلة على أداة الحماية وتحديثات قواعدها.", "التأكد من أنها إما تحظر هجمات الويب أو تولّد تنبيهات يجري التحقيق فيها فورًا.", "السؤال عن كيفية اختبار التطبيقات الجديدة قبل إطلاقها."]], "j": ["Req. 6.4.2 requires an automated technical solution in front of public-facing web applications that continually detects and prevents web-based attacks, is active and up to date, generates audit logs, and either blocks attacks or generates alerts that are immediately investigated. This requirement became effective on 31 March 2025. These apps are attacked constantly.", "يشترط البند 6.4.2 حلًا تقنيًا آليًا أمام تطبيقات الويب العامة يكتشف هجمات الويب ويمنعها باستمرار، ويكون فعّالًا ومحدّثًا، ويولّد سجلات تدقيق، ويحظر الهجمات أو يولّد تنبيهات يُحقَّق فيها فورًا. وأصبح هذا المتطلب نافذًا في 31 مارس 2025. وهذه التطبيقات تتعرض للهجوم باستمرار."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 6.4.2", "e": "Automated protection for public-facing web applications", "a": "حماية آلية لتطبيقات الويب العامة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-4", "e": "Application Security", "a": "أمن التطبيقات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 31, "d": 4, "t": ["Payment page script protection", "حماية سكربتات صفحة الدفع"], "k": ["One tampered script on your payment page can copy customers' card numbers as they type.", "سكربت واحد تم العبث به في صفحة الدفع قد ينسخ أرقام بطاقات العملاء أثناء كتابتها."], "q": ["Do you keep a list of every script on your payment pages, with a reason and approval for each, and do you detect unauthorized changes to those pages?", "هل تحتفظون بقائمة بكل سكربت في صفحات الدفع، مع سبب واعتماد لكل منها، وهل تكتشفون التغييرات غير المصرّح بها في تلك الصفحات؟"], "a": [["Request the script inventory for payment pages.", "Check that each script has a documented business or technical justification and is authorized.", "Verify that a mechanism is in place to assure the integrity of each script; do not treat a Content Security Policy alone as proof of script integrity.", "Confirm there is tamper detection and alerting, checked at least weekly.", "Review any third-party scripts, such as analytics or chat tools."], ["طلب جرد السكربتات في صفحات الدفع.", "التأكد من أن لكل سكربت مبررًا تجاريًا أو تقنيًا موثقًا واعتمادًا.", "التحقق من وجود آلية تضمن سلامة كل سكربت، وعدم اعتبار سياسة أمان المحتوى (CSP) وحدها دليلًا على سلامة السكربت.", "التأكد من وجود كشف للتلاعب وتنبيه، مع فحصه أسبوعيًا على الأقل.", "مراجعة أي سكربتات لأطراف خارجية مثل أدوات التحليلات أو الدردشة."]], "j": ["Req. 6.4.3 requires scripts on payment pages to be authorized, justified and inventoried. Req. 11.6.1 requires detection of unauthorized changes to those pages. Web-skimming attacks (Magecart style) steal card data without touching the bank's servers. Item 30 protects the web application, and this item covers the code running in the customer's browser.", "يشترط البند 6.4.3 أن تكون السكربتات في صفحات الدفع معتمدة ومبررة ومجرودة، ويشترط البند 11.6.1 اكتشاف التغييرات غير المصرّح بها في تلك الصفحات. وتسرق هجمات سرقة البيانات من الويب (على نمط Magecart) بيانات البطاقات دون لمس خوادم البنك. والبند 30 يحمي تطبيق الويب، أما هذا البند فيغطي الشيفرة التي تعمل في متصفح العميل."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 6.4.3", "e": "Payment page scripts managed", "a": "إدارة سكربتات صفحة الدفع", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 11.6.1", "e": "Change and tamper detection on payment pages", "a": "كشف التغيير والتلاعب في صفحات الدفع", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CTO-4", "e": "Application Security", "a": "أمن التطبيقات", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 32, "d": 5, "t": ["A written incident response plan", "خطة مكتوبة للاستجابة للحوادث"], "k": ["A fire drill plan must exist before the fire.", "خطة تدريبات الحريق يجب أن توجد قبل الحريق."], "q": ["Does the bank have a documented incident response plan with roles, contact lists, containment steps and recovery procedures, ready to start at once?", "هل لدى البنك خطة موثقة للاستجابة للحوادث تتضمن الأدوار وقوائم الاتصال وخطوات الاحتواء وإجراءات التعافي، وجاهزة للتشغيل فورًا؟"], "a": [["Request the plan.", "Check roles, communication and notification steps (including payment brands and acquirers).", "Ask when it was last used for a real event.", "Confirm executives know their role."], ["طلب الخطة.", "فحص الأدوار وخطوات الاتصال والإخطار (بما في ذلك شبكات الدفع والبنوك المحصّلة).", "السؤال عن آخر مرة استُخدمت فيها في حدث حقيقي.", "التأكد من أن التنفيذيين يعرفون أدوارهم."]], "j": ["An incident response plan must exist and be ready to activate, covering roles, communication, containment, recovery, and business continuity and backup processes. Without it, response is slow and chaotic.", "يجب أن توجد خطة للاستجابة للحوادث وجاهزة للتفعيل، تغطي الأدوار والاتصال والاحتواء والتعافي وعمليات استمرارية الأعمال والنسخ الاحتياطي. وبدونها تكون الاستجابة بطيئة وفوضوية."], "r": "High", "u": "Immediate", "s": [{"k": "pci", "l": "PCI DSS 12.10.1", "e": "Incident response plan", "a": "خطة الاستجابة للحوادث", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-2", "e": "Incident Management", "a": "إدارة الحوادث", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 33, "d": 5, "t": ["The plan is tested every year", "اختبار الخطة كل عام"], "k": ["A fire drill you never practice will not work on the day.", "تدريب الحريق الذي لا تمارسه لن ينجح يوم الحاجة."], "q": ["Is the incident response plan reviewed, updated and tested at least every 12 months?", "هل تُراجع خطة الاستجابة للحوادث وتُحدَّث وتُختبر مرة كل 12 شهرًا على الأقل؟"], "a": [["Ask for the last test report and date.", "Check who took part.", "Confirm the plan was updated afterwards.", "Ask what scenario was used (for example ransomware or a card data breach)."], ["طلب آخر تقرير اختبار وتاريخه.", "التحقق من المشاركين.", "التأكد من تحديث الخطة بعد ذلك.", "السؤال عن السيناريو المستخدم (مثل برامج الفدية أو اختراق بيانات البطاقات)."]], "j": ["The plan must be reviewed and tested at least once every 12 months. Testing finds gaps while mistakes are still cheap.", "يجب مراجعة الخطة واختبارها مرة كل 12 شهرًا على الأقل. والاختبار يكشف الثغرات بينما الأخطاء لا تزال رخيصة."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 12.10.2", "e": "Plan reviewed and tested every 12 months", "a": "مراجعة الخطة واختبارها كل 12 شهرًا", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-2", "e": "Incident Management", "a": "إدارة الحوادث", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 34, "d": 5, "t": ["Trained responders available 24/7", "فريق استجابة مدرَّب متاح على مدار الساعة"], "k": ["Emergencies do not wait for office hours.", "الطوارئ لا تنتظر ساعات العمل."], "q": ["Are named staff available around the clock to respond to incidents, and are they trained for it?", "هل يتوفر موظفون محددون بالاسم للاستجابة للحوادث على مدار الساعة، وهل هم مدرَّبون على ذلك؟"], "a": [["Request the on-call roster.", "Ask the response time for a night-time alert.", "Request training records.", "Check there is a backup if the main contact is unreachable."], ["طلب جدول المناوبة.", "السؤال عن زمن الاستجابة لتنبيه ليلي.", "طلب سجلات التدريب.", "التأكد من وجود بديل إذا تعذّر الوصول إلى جهة الاتصال الرئيسية."]], "j": ["Specific personnel must be designated to be available around the clock and be trained appropriately. Req. 12.10.4.1 requires a targeted risk analysis to determine the frequency of periodic incident-response training. Attacks often start at night or on holidays.", "يجب تحديد أفراد معينين ليكونوا متاحين على مدار الساعة ومدرَّبين تدريبًا مناسبًا. ويشترط البند 12.10.4.1 تحليل مخاطر موجَّهًا لتحديد وتيرة التدريب الدوري على الاستجابة للحوادث. وكثيرًا ما تبدأ الهجمات ليلًا أو في العطلات."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 12.10.3", "e": "Personnel available 24/7", "a": "موظفون متاحون على مدار الساعة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.10.4", "e": "Incident response training", "a": "التدريب على الاستجابة للحوادث", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.10.4.1", "e": "Training frequency from a targeted risk analysis", "a": "وتيرة التدريب من تحليل مخاطر موجَّه", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-2", "e": "Incident Management", "a": "إدارة الحوادث", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 35, "d": 5, "t": ["Security alerts are monitored and answered", "مراقبة تنبيهات الأمن والرد عليها"], "k": ["An alarm nobody listens to is just noise.", "إنذار لا يستمع إليه أحد ليس سوى ضجيج."], "q": ["Does the response plan include monitoring and responding to alerts from intrusion detection, firewalls, file integrity monitoring and other security tools?", "هل تتضمن خطة الاستجابة مراقبة التنبيهات الصادرة عن كشف التسلل وجدران الحماية ومراقبة سلامة الملفات وأدوات الأمان الأخرى والرد عليها؟"], "a": [["List the alert sources and who watches them.", "Review three recent alerts and how each was closed.", "Check alert volume is manageable.", "Ask how long an alert waits before action."], ["سرد مصادر التنبيهات ومن يراقبها.", "مراجعة ثلاثة تنبيهات حديثة وكيف أُغلق كل منها.", "التأكد من أن حجم التنبيهات قابل للإدارة.", "السؤال عن المدة التي ينتظرها التنبيه قبل اتخاذ إجراء."]], "j": ["The incident response plan must cover monitoring and responding to alerts from security monitoring systems. Detection tools give no value if alerts are ignored.", "يجب أن تغطي خطة الاستجابة للحوادث مراقبة التنبيهات الصادرة عن أنظمة المراقبة الأمنية والرد عليها. وأدوات الكشف لا قيمة لها إذا أُهملت التنبيهات."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 12.10.5", "e": "Monitoring and responding to security alerts", "a": "مراقبة التنبيهات الأمنية والرد عليها", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-1", "e": "Security Operations, Threat Intelligence, and Insider Threat", "a": "العمليات الأمنية واستخبارات التهديدات والتهديد الداخلي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 36, "d": 5, "t": ["Logs are collected and reviewed at required intervals", "جمع السجلات ومراجعتها بالوتيرة المطلوبة"], "k": ["A security camera is useful only if somebody watches the footage.", "كاميرا المراقبة لا تنفع إلا إذا شاهد أحدهم التسجيل."], "q": ["Are audit logs enabled on all system components, with logs of security events and critical systems reviewed daily and other in-scope system logs reviewed periodically based on risk?", "هل سجلات التدقيق مفعّلة على كل مكونات النظام، مع مراجعة سجلات الأحداث الأمنية والأنظمة الحرجة يوميًا ومراجعة سجلات النظم الأخرى الداخلة في النطاق دوريًا بحسب المخاطر؟"], "a": [["Ask which systems send logs to a central place.", "Check that logs record who, what and when.", "Request evidence of daily review for logs covered by Req. 10.4.1 and periodic review of other in-scope system logs.", "Look for systems with no logging."], ["السؤال عن الأنظمة التي ترسل سجلاتها إلى مكان مركزي.", "التأكد من أن السجلات تسجل من وماذا ومتى.", "طلب أدلة على المراجعة اليومية للسجلات التي يغطيها البند 10.4.1 والمراجعة الدورية لسجلات النظم الأخرى الداخلة في النطاق.", "البحث عن أنظمة بلا تسجيل."]], "j": ["Audit logs must be enabled on all system components. Req. 10.4.1 requires logs of specified security events and critical systems to be reviewed at least daily. Req. 10.4.2 and 10.4.2.1 require other in-scope system logs to be reviewed periodically at a frequency determined through a targeted risk analysis. Logs help a bank detect fraud and prove what happened.", "يجب تفعيل سجلات التدقيق على كل مكونات النظام. ويشترط البند 10.4.1 مراجعة سجلات أحداث أمنية محددة والأنظمة الحرجة يوميًا على الأقل. ويشترط البندان 10.4.2 و10.4.2.1 مراجعة سجلات النظم الأخرى الداخلة في النطاق دوريًا بوتيرة تحددها عبر تحليل مخاطر موجَّه. وتساعد السجلات البنك على اكتشاف الاحتيال وإثبات ما حدث."], "r": "High", "u": "1 to 2 Weeks", "s": [{"k": "pci", "l": "PCI DSS 10.2.1", "e": "Audit logs enabled", "a": "تفعيل سجلات التدقيق", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 10.4.1", "e": "Daily review of key logs", "a": "مراجعة يومية للسجلات الأساسية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 10.4.2", "e": "Periodic review of other in-scope logs", "a": "مراجعة دورية للسجلات الأخرى", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 10.4.2.1", "e": "Review frequency from a targeted risk analysis", "a": "وتيرة المراجعة من تحليل مخاطر موجَّه", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-1", "e": "Security Operations, Threat Intelligence, and Insider Threat", "a": "العمليات الأمنية واستخبارات التهديدات والتهديد الداخلي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 37, "d": 5, "t": ["Logs are protected and kept long enough", "حماية السجلات وحفظها لمدة كافية"], "k": ["The security tape must not be erasable, and must be kept long enough to use.", "شريط الأمن يجب ألا يكون قابلًا للمسح، وأن يُحفظ مدة كافية لاستخدامه."], "q": ["Are logs protected from change, and kept for at least 12 months with the last three months immediately available?", "هل السجلات محمية من التعديل، وتُحفظ 12 شهرًا على الأقل مع إتاحة آخر ثلاثة أشهر فورًا؟"], "a": [["Ask who can edit or delete logs.", "Request the retention setting.", "Ask the team to retrieve a three-month-old log.", "Check logs are backed up to a separate system."], ["السؤال عمّن يستطيع تعديل السجلات أو حذفها.", "طلب إعداد الاحتفاظ.", "طلب من الفريق استرجاع سجل عمره ثلاثة أشهر.", "التأكد من وجود نسخ احتياطية للسجلات على نظام منفصل."]], "j": ["Logs must be protected from modification and retained for at least 12 months, with three months available for immediate analysis. Attackers often delete logs to hide, and investigations need history.", "يجب حماية السجلات من التعديل والاحتفاظ بها 12 شهرًا على الأقل، مع إتاحة ثلاثة أشهر للتحليل الفوري. وكثيرًا ما يحذف المهاجمون السجلات لإخفاء أثرهم، وتحتاج التحقيقات إلى التاريخ."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 10.3.2", "e": "Audit logs protected from modification", "a": "حماية سجلات التدقيق من التعديل", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 10.5.1", "e": "Log retention of 12 months", "a": "الاحتفاظ بالسجلات 12 شهرًا", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-1", "e": "Security Operations, Threat Intelligence, and Insider Threat", "a": "العمليات الأمنية واستخبارات التهديدات والتهديد الداخلي", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 38, "d": 5, "t": ["Backups and disaster recovery", "النسخ الاحتياطي والتعافي من الكوارث"], "k": ["If the building burns down, you need a copy of your records somewhere else.", "إذا احترق المبنى، فأنت بحاجة إلى نسخة من سجلاتك في مكان آخر."], "q": ["Does the bank back up critical systems, keep copies offline or separate, and test that it can restore them within its target recovery time?", "هل يحتفظ البنك بنسخ احتياطية للأنظمة الحرجة، ويحفظ نسخًا خارجية أو منفصلة، ويختبر قدرته على استعادتها ضمن زمن التعافي المستهدف؟"], "a": [["Request the continuity and disaster recovery plan.", "Ask for recovery time and recovery point targets.", "Request the last restore test result.", "Check at least one backup copy cannot be reached from the main network (ransomware protection)."], ["طلب خطة الاستمرارية والتعافي من الكوارث.", "طلب أهداف زمن التعافي ونقطة التعافي.", "طلب نتيجة آخر اختبار استعادة.", "التأكد من أن نسخة احتياطية واحدة على الأقل لا يمكن الوصول إليها من الشبكة الرئيسية (الحماية من برامج الفدية)."]], "j": ["A bank must keep serving customers after ransomware, outage or disaster. Backups that were never tested often fail when needed. The CBE business resilience clause and ISO 27001 controls on ICT continuity readiness and information backup support this.", "يجب أن يواصل البنك خدمة العملاء بعد برامج الفدية أو الأعطال أو الكوارث. والنسخ الاحتياطية التي لم تُختبر كثيرًا ما تفشل وقت الحاجة. ويدعم ذلك بند المرونة التشغيلية في إطار البنك المركزي المصري وضوابط ISO 27001 المتعلقة بجاهزية تقنية المعلومات والاتصالات للاستمرارية والنسخ الاحتياطي للمعلومات."], "r": "High", "u": "Immediate", "s": [{"k": "cbe", "l": "CBE OVM-2", "e": "Business Resilience", "a": "مرونة الأعمال", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}, {"k": "iso", "l": "ISO 27001 A.5.30", "e": "ICT readiness for business continuity", "a": "جاهزية تقنية المعلومات والاتصالات لاستمرارية الأعمال", "u": "https://www.iso.org/standard/27001"}, {"k": "iso", "l": "ISO 27001 A.8.13", "e": "Information backup", "a": "النسخ الاحتياطي للمعلومات", "u": "https://www.iso.org/standard/27001"}]}, {"n": 39, "d": 5, "t": ["Lessons learned and unexpected card data", "الدروس المستفادة والبيانات غير المتوقعة للبطاقات"], "k": ["After every accident, fix the cause so it does not happen twice.", "بعد كل حادث، أصلح السبب حتى لا يتكرر."], "q": ["After an incident, is the plan updated from lessons learned, and is there a procedure for when stored card numbers are found where they should not be?", "بعد الحادث، هل تُحدَّث الخطة بناءً على الدروس المستفادة، وهل يوجد إجراء عند العثور على أرقام بطاقات مخزنة في أماكن غير متوقعة؟"], "a": [["Ask for the last post-incident review and changes made.", "Check the procedure for finding card data in an unexpected location (who is told, how it is removed, how the cause is found).", "Confirm findings are tracked to closure."], ["طلب آخر مراجعة بعد حادث والتغييرات التي أُجريت.", "فحص إجراء التعامل مع بيانات البطاقات الموجودة في مكان غير متوقع (من يُبلَّغ، وكيف تُزال، وكيف يُعرف السبب).", "التأكد من متابعة النتائج حتى الإغلاق."]], "j": ["The plan must be improved using lessons learned and industry developments, and procedures must exist for when stored PAN is found anywhere it is not expected. Learning from incidents lowers repeat risk.", "يجب تحسين الخطة باستخدام الدروس المستفادة وتطورات القطاع، ووجود إجراءات عند العثور على PAN مخزَّن في مكان غير متوقع. والتعلم من الحوادث يقلل مخاطر التكرار."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 12.10.6", "e": "Plan evolves from lessons learned", "a": "تطوير الخطة من الدروس المستفادة", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.10.7", "e": "Procedures when PAN is found where not expected", "a": "إجراءات عند العثور على PAN في مكان غير متوقع", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE CD-2", "e": "Incident Management", "a": "إدارة الحوادث", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}, {"n": 40, "d": 5, "t": ["Security awareness training", "التوعية الأمنية والتدريب"], "k": ["The best firewall fails if an employee clicks the wrong link.", "أفضل جدار ناري يفشل إذا نقر موظف على الرابط الخطأ."], "q": ["Do all employees receive security awareness training when hired and at least every 12 months, including phishing and social engineering?", "هل يتلقى كل الموظفين تدريبًا على التوعية الأمنية عند التعيين وكل 12 شهرًا على الأقل، يشمل التصيّد والهندسة الاجتماعية؟"], "a": [["Request the training program content and schedule.", "Request completion records for all staff, including contractors.", "Check that phishing and social engineering are covered.", "Ask for results of phishing simulations.", "Check that staff know how to report a suspicious email or incident (Item 32)."], ["طلب محتوى برنامج التدريب وجدوله.", "طلب سجلات الإتمام لكل الموظفين بمن فيهم المتعاقدون.", "التأكد من تغطية التصيّد والهندسة الاجتماعية.", "طلب نتائج محاكاة التصيّد.", "التأكد من أن الموظفين يعرفون كيف يبلّغون عن رسالة بريد مشبوهة أو حادث (البند 32)."]], "j": ["Req. 12.6.1 requires a formal awareness program. Req. 12.6.3 requires training upon hire and at least every 12 months, and Req. 12.6.3.1 specifically requires awareness of phishing and related attacks and social engineering. Phishing is a leading way attackers get a first foothold, and staff are often the first to notice an incident.", "يشترط البند 12.6.1 برنامجًا رسميًا للتوعية. ويشترط البند 12.6.3 التدريب عند التعيين وكل 12 شهرًا على الأقل، ويشترط البند 12.6.3.1 صراحةً التوعية بالتصيّد والهجمات المشابهة والهندسة الاجتماعية. والتصيّد من أبرز الطرق التي يحصل بها المهاجمون على موطئ قدم أول، والموظفون غالبًا أول من يلاحظ الحادث."], "r": "Medium", "u": "1 to 3 Months", "s": [{"k": "pci", "l": "PCI DSS 12.6.1", "e": "Formal security awareness program", "a": "برنامج رسمي للتوعية الأمنية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.6.3", "e": "Awareness training on hire and every 12 months", "a": "تدريب توعوي عند التعيين وكل 12 شهرًا", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "pci", "l": "PCI DSS 12.6.3.1", "e": "Phishing and social engineering awareness", "a": "التوعية بالتصيّد والهندسة الاجتماعية", "u": "https://www.pcisecuritystandards.org/document_library/"}, {"k": "cbe", "l": "CBE GOV-4", "e": "Security Awareness and Training", "a": "التوعية والتدريب الأمني", "u": "https://opensecurityarchitecture.org/frameworks/cbe-csf/controls"}]}]};

const I=DATA.items;let L="en",tab="c",hideDone=false,dom=-1;const done=new Set();

const $=id=>document.getElementById(id),T=()=>UI[L],n=()=>L==="en"?0:1;

<p class="q"><b>${u.q}:</b> ${esc(x.q[k])}</p>
<div class="tags"><b>${u.std}:</b>${chips(x)}<span class="tag ${x.r}">${u.risk}: ${u.R[x.r]}</span><span class="tag">${u.urg}: ${u.U[x.u]}</span></div>
<details><summary>${u.act}</summary><ul>${x.a[k].map(a=>`<li>${esc(a)}</li>`).join("")}</ul><p class="why"><b>${u.why}:</b> ${esc(x.j[k])}</p></details></div>`}
function render(){const u=T(),k=n();document.documentElement.lang=L;document.documentElement.dir=u.dir;
$("title").textContent=u.title;$("sub").textContent=u.sub;$("tabC").textContent=u.check;$("tabP").textContent=u.prio;$("hide").textContent=u.hide;$("hide").setAttribute("aria-pressed",hideDone);$("print").textContent=u.print;$("lang").textContent=L==="en"?"العربية":"English";$("note").innerHTML=u.note;
$("dom").innerHTML=`<option value="-1">${u.all}</option>`+DATA.domains[k].map((d,i)=>`<option value="${i}" ${dom===i?"selected":""}>${esc(d)}</option>`).join("");$("dom").style.display=tab==="c"?"":"none";
$("tabC").className=tab==="c"?"on":"";$("tabP").className=tab==="p"?"on":"";
$("prog").textContent=`${done.size} / ${I.length} ${u.prog}`;$("meter").style.width=(done.size/I.length*100)+"%";

if(tab==="c"){DATA.domains[k].forEach((d,di)=>{if(dom>=0&&dom!==di)return;const rows=I.map((x,i)=>[x,i]).filter(([x,i])=>x.d===di&&!(hideDone&&done.has(i)));if(rows.length)h+=`<h2>${esc(d)}</h2>`+rows.map(([x,i])=>card(x,i)).join("")})}
else{const open=I.map((x,i)=>[x,i]).filter(([x,i])=>!done.has(i)).sort((a,b)=>UR[a[0].u]-UR[b[0].u]||(a[0].r==="High"?0:1)-(b[0].r==="High"?0:1)||a[0].n-b[0].n);

if(!h)h=`<div class="empty">${u.empty}</div>`;$("view").innerHTML=h}
